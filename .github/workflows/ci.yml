name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
          cache-suffix: lint

      # uv run uses the ruff version pinned in uv.lock, so a new ruff release
      # can never break CI on its own.
      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        environs-version: ["14.2.0", "15.0.1"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.environs-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --with "environs[django]==${{ matrix.environs-version }}" pytest --cov --cov-config=pyproject.toml
